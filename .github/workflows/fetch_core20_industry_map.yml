name: Fetch core20 industry map
on:
  push:
    paths:
      - 'scripts/fetch_core20_industry_map.py'
      - '.github/workflows/fetch_core20_industry_map.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/fetch_core20_industry_map.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20-industry-map-20260828
          path: output_core20_industry/
          if-no-files-found: error
