name: Build last 3 stock OHLC

on:
  push:
    branches: [main]
    paths:
      - scripts/build_last3.py
      - .github/workflows/build_last3.yml
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-last3:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == 'run-last3' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download, filter, QA, cross-check, and commit outputs
        shell: bash
        run: |
          set +e
          python scripts/build_last3.py
          status=$?
          set -e

          mkdir -p output
          echo "$status" > output/exit_code.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if ! git diff --cached --quiet; then
            git commit -m "Build 3665 4916 6770 historical OHLC and QA"
            git push
          fi

          exit "$status"
