name: public-market-daily
on:
  schedule:
    - cron: '17 10 * * 1-5' # 18:17 Asia/Taipei, before the existing 19:00 report
  workflow_dispatch:
    inputs:
      target_date:
        description: 'YYYY-MM-DD; blank means current Asia/Taipei date'
        required: false
        type: string
  push:
    branches: [main]
    paths: [.github/workflows/public_market_daily.yml]
permissions:
  contents: read
concurrency:
  group: public-market-daily-${{ github.event.inputs.target_date || github.event.schedule || github.sha }}
  cancel-in-progress: false
jobs:
  fetch-public-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch and validate public originals
        env:
          REQUESTED_DATE: ${{ inputs.target_date }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          """Public exchange originals only; no portfolio data, forecasts, or trading writes."""
          import concurrent.futures, datetime as dt, decimal, hashlib, json, os, pathlib, re, sys, time
          import urllib.request, urllib.error, urllib.parse
          from zoneinfo import ZoneInfo
          MAX=20_000_000
          def strict(raw):
              def pairs(items):
                  out={}
                  for k,v in items:
                      if k in out: raise ValueError('DUPLICATE_KEY:'+k)
                      out[k]=v
                  return out
              return json.loads(raw.decode('utf-8-sig'),object_pairs_hook=pairs,parse_constant=lambda x: (_ for _ in ()).throw(ValueError(x)))
          def validate(doc,key,date):
              if not isinstance(doc,dict): raise ValueError('NOT_OBJECT')
              if doc.get('stat') not in (('ok','OK') if key in ('tpex','calendar') else ('OK',)):
                  raise ValueError('RESPONSE_NOT_OK:'+str(doc.get('stat')))
              if key=='calendar':
                  if not doc.get('data'): raise ValueError('CALENDAR_EMPTY')
                  return {'status':'CALENDAR_RAW_SAVED_NOT_SESSION_INDEX'}
              if key in ('twse','tpex'):
                  if str(doc.get('date'))!=date.strftime('%Y%m%d'): raise ValueError('WRONG_DATE')
                  tables=doc.get('tables',[])
                  if doc.get('fields') is not None: tables=tables+[doc]
                  for k in doc:
                      if re.fullmatch(r'fields\d+',k): tables.append({'fields':doc[k],'data':doc.get('data'+k[6:],[])})
                  seen=set();valid=0;unavailable=0
                  for t in tables:
                      fields=t.get('fields',[])
                      sc='證券代號' if '證券代號' in fields else '代號'
                      pc='收盤價' if '收盤價' in fields else '收盤'
                      if sc not in fields or pc not in fields: continue
                      if fields.count(sc)!=1 or fields.count(pc)!=1: raise ValueError('DUPLICATE_COLUMN')
                      si,pi=fields.index(sc),fields.index(pc)
                      for row in t['data']:
                          if len(row)!=len(fields): raise ValueError('MALFORMED_ROW')
                          symbol=str(row[si]).strip()
                          if symbol in seen: raise ValueError('DUPLICATE_SYMBOL:'+symbol)
                          seen.add(symbol);s=str(row[pi]).strip().replace(',','')
                          if s in ('','--','---','----'): unavailable+=1;continue
                          n=decimal.Decimal(s)
                          if not n.is_finite() or n<=0: raise ValueError('BAD_PRICE:'+symbol)
                          valid+=1
                  if not valid: raise ValueError('NO_QUOTE_ROWS')
                  return {'status':'PARSED_EXACT_DATE','unique_symbols':len(seen),'valid_closes':valid,'unavailable_closes':unavailable}
              fields=doc.get('fields',[]);rows=doc.get('data',[])
              for f in ('日期','開盤指數','最高指數','最低指數','收盤指數'):
                  if fields.count(f)!=1: raise ValueError('OHLC_SCHEMA:'+f)
              ds=f'{date.year-1911}/{date.month:02d}/{date.day:02d}'
              matches=[r for r in rows if str(r[fields.index('日期')])==ds]
              if len(matches)!=1 or len(matches[0])!=len(fields): raise ValueError('OHLC_DATE_MISSING_OR_DUPLICATE')
              values=[decimal.Decimal(str(matches[0][fields.index(f)]).replace(',','')) for f in ('開盤指數','最高指數','最低指數','收盤指數')]
              op,hi,lo,cl=values
              if not all(n.is_finite() and n>0 for n in values) or not (lo<=op<=hi and lo<=cl<=hi): raise ValueError('OHLC_VALUES')
              return {'status':'PARSED_EXACT_DATE','matched_rows':1}
          def main():
              today=dt.datetime.now(ZoneInfo('Asia/Taipei')).date()
              event=os.environ.get('GITHUB_EVENT_NAME','manual')
              requested=os.environ.get('REQUESTED_DATE','').strip()
              # Push is explicitly historical integration smoke, never current market data.
              if not requested and event=='push': requested='2026-09-24'
              date=dt.date.fromisoformat(requested) if requested else today
              if date>today: raise ValueError('FUTURE_DATE_FORBIDDEN')
              root=pathlib.Path('public-daily')/date.isoformat();root.mkdir(parents=True,exist_ok=True)
              sources={
                'twse':f'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date={date:%Y%m%d}&type=ALLBUT0999&response=json',
                'tpex':f'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date={date:%Y/%m/%d}&id=&response=json',
                'ohlc':f'https://www.twse.com.tw/rwd/zh/TAIEX/MI_5MINS_HIST?date={date:%Y%m%d}&response=json',
                'calendar':f'https://www.twse.com.tw/holidaySchedule/holidaySchedule?response=json&queryYear={date.year-1911}'}
              def fetch(item):
                  key,url=item;history=[]
                  for attempt in range(1,3):
                      rec={'key':key,'requested_url':url,'retrieved_at':dt.datetime.now(dt.timezone.utc).isoformat(),'attempt':attempt}
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 public-market-research','Accept':'application/json'})
                          try: r=urllib.request.urlopen(req,timeout=30)
                          except urllib.error.HTTPError as exc: r=exc
                          with r:
                              raw=r.read(MAX+1);rec.update(http_status=r.status,final_url=r.geturl(),content_type=r.headers.get('Content-Type',''))
                          if len(raw)>MAX: raise ValueError('RESPONSE_TOO_LARGE')
                          name=f'{key}.attempt{attempt}.json';(root/name).write_bytes(raw)
                          rec.update(path=name,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
                          if urllib.parse.urlparse(rec['final_url']).hostname!=urllib.parse.urlparse(url).hostname: raise ValueError('REDIRECT_ORIGIN_MISMATCH')
                          if rec['http_status']!=200: raise ValueError('HTTP_NOT_200')
                          rec.update(validate(strict(raw),key,date));history.append(rec);break
                      except Exception as exc:
                          rec.update(status='NOT_VALIDATED',error=type(exc).__name__+': '+str(exc));history.append(rec)
                          if attempt==1 and (rec.get('http_status') in (429,500,502,503,504) or 'URLError' in rec['error']): time.sleep(2);continue
                          break
                  return {'key':key,'attempts':history,'result':history[-1]}
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool: results=list(pool.map(fetch,sources.items()))
              ok=sum(x['result']['status']=='PARSED_EXACT_DATE' for x in results)
              calendar_ok=next(x['result']['status']=='CALENDAR_RAW_SAVED_NOT_SESSION_INDEX' for x in results if x['key']=='calendar')
              ready=ok==3 and calendar_ok
              manifest={'schema':'PUBLIC_DAILY_ORIGINALS_V1','data_date':date.isoformat(),'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),'github_run_id':os.environ.get('GITHUB_RUN_ID'),'commit':os.environ.get('GITHUB_SHA'),'event':event,'mode':'HISTORICAL_INTEGRATION_SMOKE' if event=='push' else 'DAILY_PUBLIC_RETRIEVAL','scope':'PUBLIC_SOURCES_ONLY_NO_PORTFOLIO_NO_FORECAST_NO_OOS','status':'MARKET_BYTES_READY' if ready else 'PARTIAL_OR_NO_DATA_NOT_ASSUMED_HOLIDAY','sources':results}
              (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
              print(json.dumps(manifest,ensure_ascii=False,indent=2))
              return 0 if ready else 2
          if __name__=='__main__': sys.exit(main())
          PYCODE
      - name: Preserve originals, validation and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-market-daily-${{ github.run_id }}
          path: public-daily/
          if-no-files-found: error
          retention-days: 90
