name: stock-daily-nextsession-68-source-closure
on:
  workflow_dispatch:
  schedule:
    - cron: '45 12 * * 1,2,3,4,5' # Semantically unchanged weekdays 20:45 Asia/Taipei; refresh scheduled workflow actor
  workflow_run:
    workflows: [public-market-daily]
    types: [completed]
    branches: [main]
  push:
    branches: [stock-source-verified-closures-20261026, stock-generic-source-three-original-20261014, stock-source-report-continuity-20261014, stock-daily-nextsession-source-20261013, stock-source-ohlc-provenance-20261013, stock-native-symbol-name-20261013, stock-integrate-dividend-sidecar-20261013, stock-partial-source-fallback-20261013, stock-readable-fallback-20261013, stock-short-history-proxy-20261013, stock-source-calendar-sha-same-manifest-20261013, stock-network-incomplete-read-retry-20261013, stock-source-schedule-revive-fallback-20261013, stock-source-recovery-debounce-20261013, stock-three-original-research-20261014]
    paths:
      - '.github/workflows/stock_daily_nextsession_source_closure_20261013.yml'
      - 'scripts/stock_daily_prior_close_source_closure_v1_20261013.py'
      - 'scripts/stock_verified_market_sessions_v1_20261026.py'
      - 'scripts/stock_dividend_factor_reconciliation_v1_20261013.py'
      - 'scripts/stock_partial_source_fallback_v1_20261013.py'
      - 'scripts/stock_short_history_research_proxy_v1_20261013.py'
      - 'scripts/premarket_daily_inputs_3y_20261013.py'
      - 'scripts/stock_network_partial_retry_guard_20261013.py'
      - 'scripts/stock_dual_origin_prior_close_research_v1_20261013.py'
      - 'scripts/stock_three_original_prior_close_research_20261014.py'
      - 'scripts/stock_three_original_generic_research_v1_20261014.py'
      - 'scripts/stock_three_original_archive_locator_v1_20261014.py'
      - 'scripts/stock_source_report_continuity_v1_20261014.py'
      - 'scripts/stock_taiex_14gap_research_v1_20261013.py'
      - 'scripts/stock_source_trigger_guard_v2_20261013.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: stock-daily-source68-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-gate-unit-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run source-window/date/quote-hash fail-closed self-tests
        run: |
          mkdir -p source_gate_qa
          python -m py_compile scripts/stock_daily_prior_close_source_closure_v1_20261013.py scripts/stock_verified_market_sessions_v1_20261026.py
          python scripts/stock_daily_prior_close_source_closure_v1_20261013.py --self-test | tee source_gate_qa/55_tests.json
          python - <<'PY'
          import json
          x=json.load(open('source_gate_qa/55_tests.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==55
          assert x['scope']=='PUBLIC_SYNTHETIC_TESTS_ONLY_NO_PRIVATE_SOURCE_NO_FORMAL'
          PY
      - name: Validate optional dividend-factor research helper independently
        run: |
          python -m py_compile scripts/stock_dividend_factor_reconciliation_v1_20261013.py
          python scripts/stock_dividend_factor_reconciliation_v1_20261013.py --self-test > source_gate_qa/dividend15_tests.json
          python - <<'PY'
          import json
          a=json.load(open("source_gate_qa/dividend15_tests.json"))
          assert a["status"]=="PASS" and a["passed"]==a["total"]==15,a
          assert a["scope"]=="SYNTHETIC_NO_PRIVATE_INPUT_NO_FORMAL"
          PY
      - name: Validate 11 independent per-symbol fallback guards
        run: |
          python -m py_compile scripts/stock_partial_source_fallback_v1_20261013.py
          python scripts/stock_partial_source_fallback_v1_20261013.py --self-test > source_gate_qa/partial11_tests.json
          python - <<'PY'
          import json
          x=json.load(open('source_gate_qa/partial11_tests.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==11,x
          assert x['scope']=='SYNTHETIC_RESEARCH_ONLY_NO_FORMAL_NO_NATURAL'
          PY
      - name: Validate 16 short-history source-first research-only guards
        run: |
          python -m py_compile scripts/stock_short_history_research_proxy_v1_20261013.py
          python scripts/stock_short_history_research_proxy_v1_20261013.py --self-test > source_gate_qa/short16_tests.json
          python - <<'PY'
          import json
          t=json.load(open('source_gate_qa/short16_tests.json'))
          assert t['status']=='PASS' and t['passed']==t['total']==16,t
          assert t['scope']=='PURE_SYNTHETIC_TESTS_NO_PRIVATE_INPUT_NO_FORMAL'
          PY
      - name: Validate 10 truncated-HTTP source retry guards
        run: |
          python -m py_compile scripts/premarket_daily_inputs_3y_20261013.py scripts/stock_network_partial_retry_guard_20261013.py
          python scripts/stock_network_partial_retry_guard_20261013.py > source_gate_qa/network10_tests.json
          python - <<'PY'
          import json
          x=json.load(open('source_gate_qa/network10_tests.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==10,x
          assert x['scope']=='MOCK_HTTP_ONLY_NO_NETWORK_NO_CANONICAL_OUTPUT_NO_NATURAL'
          PY
      - name: Validate 10 research two-parent source lineage guards
        run: |
          python -m py_compile scripts/stock_dual_origin_prior_close_research_v1_20261013.py
          python scripts/stock_dual_origin_prior_close_research_v1_20261013.py --self-test > source_gate_qa/dual10_tests.json
          python - <<'PY'
          import json
          x=json.load(open('source_gate_qa/dual10_tests.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==10,x
          assert x['scope']=='PURE_SYNTHETIC_TWO_RAW_SOURCES_NO_FORMAL'
          PY
      - name: Validate 12 three-immutable-original research recovery guards
        run: |
          python -m py_compile scripts/stock_three_original_prior_close_research_20261014.py
          python scripts/stock_three_original_prior_close_research_20261014.py --self-test > source_gate_qa/three12_tests.json
          python - <<'PY'
          import json
          x=json.load(open('source_gate_qa/three12_tests.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==12,x
          assert x['scope']=='SYNTHETIC_THREE_IMMUTABLE_ORIGINALS_RESEARCH_ONLY'
          PY
      - name: Validate 12 exact-date missing-14 TAIEX research guards
        run: |
          python -m py_compile scripts/stock_taiex_14gap_research_v1_20261013.py
          python scripts/stock_taiex_14gap_research_v1_20261013.py --self-test > source_gate_qa/taiex14_12_tests.json
          python - <<'PY'
          import json
          x=json.load(open('source_gate_qa/taiex14_12_tests.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==12,x
          assert x['scope']=='SYNTHETIC_OFFICIAL_INDEX_NO_CASH_NO_FORMAL'
          PY
      - name: Validate 22 normal/recovery de-duplication and actual source job guards
        run: |
          python -m py_compile scripts/stock_source_trigger_guard_v2_20261013.py
          python scripts/stock_source_trigger_guard_v2_20261013.py --self-test > source_gate_qa/trigger22_tests.json
          python - <<'PY'
          import json
          x=json.load(open('source_gate_qa/trigger22_tests.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==22,x
          assert x['scope']=='SYNTHETIC_PURE_GATE_NO_GITHUB_API_OR_FORMAL_NATURAL'
          PY
      - name: Validate 23 research report continuity and receipt guards
        run: |
          python -m py_compile scripts/stock_source_report_continuity_v1_20261014.py
          python scripts/stock_source_report_continuity_v1_20261014.py --self-test > source_gate_qa/source_delivery23_tests.json
          python - <<'PY'
          import json
          a=json.load(open('source_gate_qa/source_delivery23_tests.json'))
          assert a['status']=='PASS' and a['passed']==a['total']==23,a
          assert a['scope']=='SYNTHETIC_REPORT_ONLY_NO_FORMAL_NO_NATURAL_NO_PLATFORM_DELIVERY'
          PY
      - name: Validate 15 date-generic immutable three-parent research guards
        run: |
          python -m py_compile scripts/stock_three_original_generic_research_v1_20261014.py
          python scripts/stock_three_original_generic_research_v1_20261014.py --self-test > source_gate_qa/generic_three15_tests.json
          python - <<'PY'
          import json
          x=json.load(open('source_gate_qa/generic_three15_tests.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==15,x
          assert x['scope']=='PURE_SYNTHETIC_GENERIC_MARKET_DATES_NO_FORMAL_NATURAL'
          PY
      - name: Validate 19 per-session GitHub archive locator identity/time guards
        run: |
          python -m py_compile scripts/stock_three_original_archive_locator_v1_20261014.py
          python scripts/stock_three_original_archive_locator_v1_20261014.py --self-test > source_gate_qa/generic_archive19_tests.json
          python - <<'PY'
          import json
          x=json.load(open('source_gate_qa/generic_archive19_tests.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==19,x
          assert x['scope']=='SYNTHETIC_ARCHIVE_LOCATOR_NO_PRIVATE_DATA_NO_FORMAL'
          PY
      - name: Preserve reusable unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-daily-source68-gate-${{ github.run_id }}
          path: |
            source_gate_qa/
            scripts/stock_daily_prior_close_source_closure_v1_20261013.py
            scripts/stock_verified_market_sessions_v1_20261026.py
            scripts/stock_partial_source_fallback_v1_20261013.py
            scripts/stock_short_history_research_proxy_v1_20261013.py
            scripts/premarket_daily_inputs_3y_20261013.py
            scripts/stock_network_partial_retry_guard_20261013.py
            scripts/stock_dual_origin_prior_close_research_v1_20261013.py
            scripts/stock_three_original_prior_close_research_20261014.py
            scripts/stock_taiex_14gap_research_v1_20261013.py
            scripts/stock_source_trigger_guard_v2_20261013.py
            scripts/stock_source_report_continuity_v1_20261014.py
            scripts/stock_three_original_generic_research_v1_20261014.py
            scripts/stock_three_original_archive_locator_v1_20261014.py
          retention-days: 30
          if-no-files-found: error
  three-original-archived-replay-20261014:
    if: github.event_name == 'push' && github.ref == 'refs/heads/stock-three-original-research-20261014'
    needs: [source-gate-unit-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch immutable 10-12 original (2026-10-13 planned input)
        uses: actions/download-artifact@v4
        with:
          name: stock-public-input-20261013-38265016756-1
          repository: colinfgl/stock-data-helper
          run-id: 38265016756
          github-token: ${{ github.token }}
          path: fixture/old
      - name: Fetch 10-13 evening authentic source original
        uses: actions/download-artifact@v4
        with:
          name: stock-next-session-68-source-raw-38401880091
          repository: colinfgl/stock-data-helper
          run-id: 38401880091
          github-token: ${{ github.token }}
          path: fixture/evening
      - name: Fetch 10-14 before-open authentic source original
        uses: actions/download-artifact@v4
        with:
          name: stock-next-session-68-source-raw-38483763642
          repository: colinfgl/stock-data-helper
          run-id: 38483763642
          github-token: ${{ github.token }}
          path: fixture/morning
      - name: Real-original three-capture readback and official 68-price reconciliation
        run: |
          python scripts/stock_three_original_prior_close_research_20261014.py \
            --prior-dir fixture/old/public_input_20261013 \
            --evening-dir fixture/evening/stock_next_session_original_source_raw \
            --morning-dir fixture/morning/stock_next_session_original_source_raw \
            --out fixture/verified
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('fixture/verified/three_original_research_68.json')
          x=json.loads(p.read_bytes())
          assert x['EligibleResearchRows']==68 and x['ResearchHolds']==0
          assert x['MorningDirect']==65 and x['EveningFallback']==3
          assert x['FormalEligible'] is False and x['NaturalCredit']==x['OOSCredit']==0
          assert x['CanonicalPredictionWritten'] is False
          assert x['NeverTreatThreeFilesAsOneProviderOriginal'] is True
          assert len(x['Rows'])==68
          print('ORIGINAL_BYTES_REAL_REPLAY',x['EligibleResearchRows'],x['MorningDirect'],x['EveningFallback'])
          PY
      - name: Preserve archived real-source replay as research-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-three-original-real-replay-${{ github.run_id }}
          path: fixture/verified/
          retention-days: 30
          if-no-files-found: warn
  source-recovery-decision:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      should_collect: ${{ steps.prove.outputs.should_collect }}
      source_day: ${{ steps.prove.outputs.source_day }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read existing 20:45 source execution proofs before any fallback
        id: prove
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/stock_source_trigger_guard_v2_20261013.py --out stock_source_recovery_proof/20261013_recovery_decision.json
          cat stock_source_recovery_proof/20261013_recovery_decision.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve skipped/recovery source decision independently
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-source-trigger-recovery-gate-${{ github.run_id }}
          path: stock_source_recovery_proof/
          retention-days: 30
          if-no-files-found: warn
  collect-next-session-source:
    if: ${{ always() && needs.source-gate-unit-qa.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && needs.source-recovery-decision.outputs.should_collect == 'true')) }}
    needs: [source-gate-unit-qa, source-recovery-decision]
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only capture after Taipei close or before next session PRECHECK, ALL 68 codes
        id: closure
        continue-on-error: true
        env:
          VALIDATED_RECOVERY_SOURCE_DAY: ${{ needs.source-recovery-decision.outputs.source_day }}
          RUN_TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          # Normal schedule uses verified local source-time gate; delayed
          # workflow_run uses the EXACT source session from readback decision.
          if [ "$RUN_TRIGGER_EVENT" = 'workflow_run' ]; then
            if ! [[ "$VALIDATED_RECOVERY_SOURCE_DAY" =~ ^[0-9]{8}$ ]]; then
              echo 'RECOVERY_SOURCE_DAY_UNVERIFIED_HOLD'
              exit 2
            fi
            python scripts/stock_daily_prior_close_source_closure_v1_20261013.py --out stock_next_session_original_source --mode CAPTURE --day "$VALIDATED_RECOVERY_SOURCE_DAY"
          else
            python scripts/stock_daily_prior_close_source_closure_v1_20261013.py --out stock_next_session_original_source --mode CAPTURE
          fi
      - name: Optional source-chart dividend-factor audit, nonblocking
        if: always()
        continue-on-error: true
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime,json,pathlib
          from stock_dividend_factor_reconciliation_v1_20261013 import reconcile
          root=pathlib.Path("stock_next_session_original_source_raw")
          out=pathlib.Path("stock_next_session_original_source")
          out.mkdir(exist_ok=True,parents=True)
          records=[]
          for f in sorted(root.glob("chart_*.json")):
              symbol=f.name[len("chart_"):-len(".json")]
              try:
                  raw=f.read_bytes()
                  q=reconcile(raw,symbol)
                  item={"Symbol":symbol,"Status":q["Status"],"RawSHA256":q["RawSHA256"],
                        "DividendLabels":q["DividendLabels"],"Matched":q["Matched"],
                        "ThresholdExcluded":q["ExcludedByCountingThreshold"],
                        "Holds":q["Holds"],"Events":q["Events"],
                        "IssuerCrossSourceStatus":"NOT_CHECKED_NO_INDEPENDENT_ISSUER_EVENT_EVIDENCE",
                        "IssuerComparisonCount":0,"IssuerConflictCount":0}
                  if symbol=="3017.TW":
                      manifest_path=pathlib.Path("research/stock_3017_20250819_issuer_primary_manifest_20261020.json")
                      try:
                          from stock_vendor_issuer_dividend_gate_20261017 import run as compare_vendor_issuer
                          manifest=json.loads(manifest_path.read_text(encoding="utf-8"))
                          frozen_baseline_sha=manifest["VendorOriginalRawSHA256"]
                          # Each genuine NEW source capture has a NEW content hash. Freeze it
                          # with this run; preserve, never overwrite, the historical baseline pin.
                          manifest["VendorOriginalRawSHA256"]=q["RawSHA256"]
                          issuer_original=pathlib.Path(manifest["IssuerOriginalPath"]).read_bytes()
                          compare=compare_vendor_issuer(raw,symbol,manifest,issuer_original)
                          compare["ArchivedBaselineRawSHA256"]=frozen_baseline_sha
                          compare["CurrentRunSourceRawSHA256"]=q["RawSHA256"]
                          compare["OriginalIssuerEvidenceRole"]=manifest["IssuerEvents"][0]["EvidenceRole"]
                          issuer_out=out/"issuer_vendor_cross_source"
                          issuer_out.mkdir(parents=True,exist_ok=True)
                          (issuer_out/"3017_20250804_mops_original.html").write_bytes(issuer_original)
                          (issuer_out/"3017_20250819_evidence_input.json").write_text(
                              json.dumps(manifest,ensure_ascii=False,sort_keys=True,indent=2)+"\n",encoding="utf8")
                          (issuer_out/"3017_20250819_research_gate.json").write_text(
                              json.dumps(compare,ensure_ascii=False,sort_keys=True,indent=2)+"\n",encoding="utf8")
                          item.update(IssuerCrossSourceStatus=compare["Status"],
                                      IssuerComparisonCount=compare["IssuerEventCount"],
                                      IssuerConflictCount=compare["ConflictCount"],
                                      IssuerResearchReceipt="issuer_vendor_cross_source/3017_20250819_research_gate.json")
                      except (ValueError,KeyError,TypeError,OSError,AssertionError) as exc:
                          # Preserve vendor data, but NEVER silently claim external issuer PASS.
                          item.update(IssuerCrossSourceStatus="HOLD_INDEPENDENT_ISSUER_GATE_FAILURE",
                                      IssuerResearchReason=str(exc)[:160])
                  records.append(item)
              except Exception as exc:
                  records.append({"Symbol":symbol,"Status":"HOLD_SOURCE_OR_SCHEMA","Error":str(exc)[:180]})
          status="RESEARCH_SIDE_CAR_68_SYMBOL_SCAN" if len(records)==68 else "RESEARCH_SIDE_CAR_PARTIAL_SOURCE"
          report={"Status":status,"SourceChartFilesScanned":len(records),
                  "VerifiedCharts":sum(x["Status"]=="RESEARCH_MATCHED" for x in records),
                  "ChartsWithHold":sum(x["Status"].startswith("HOLD") or x["Status"]=="RESEARCH_PARTIAL_HOLD" for x in records),
                  "ThresholdExcludedEvents":sum(x.get("ThresholdExcluded",0) for x in records),
                  "IssuerAmountCrossSourceCovered":sum(x.get("IssuerComparisonCount",0) for x in records),
                  "IssuerAmountConflicts":sum(x.get("IssuerConflictCount",0) for x in records),
                  "IssuerValidation":"RESEARCH_ONLY_NOT_ISSUER_EXHAUSTIVE",
                  "ReportGeneratedAtUTC":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "Records":records,"FormalEligible":False,"NaturalCredit":0,"OOSCredit":0,
                  "Note":"VerifiedCharts is Yahoo INTERNAL factor consistency only; independent issuer amount crosscheck, when its manifest is present, can still HOLD. 3017 issuer evidence is a SHA-verified firstparty MOPS original; amount conflict and historical PIT remain separate gates. Never claim PIT, issuer exhaustive, Formal, natural/OOS, cash or chat delivery."}
          target=out/"dividend_factor_research_sidecar.json"
          target.write_text(json.dumps(report,ensure_ascii=False,indent=2,allow_nan=False)+"\n",encoding="utf8")
          print("SIDE_CAR:",report["Status"],"charts",len(records),
                "excluded dividend events",report["ThresholdExcludedEvents"])
          PY
      - name: Save 68-code verified partial market evidence independently
        if: always()
        continue-on-error: true
        run: |
          python scripts/stock_partial_source_fallback_v1_20261013.py --raw-dir stock_next_session_original_source_raw --output stock_next_session_original_source/verified_partial
      - name: Publish the full verified research fallback in Actions summary
        if: always()
        continue-on-error: true
        run: |
          f=stock_next_session_original_source/verified_partial/per_symbol_fallback.md
          if [ -f "$f" ]; then
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Verified partial-source report not generated; preserve original hold and collection receipts." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Generate three short-history D1-D10 research estimates, independent of formal H9
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib,subprocess,sys
          root=pathlib.Path('stock_next_session_original_source')
          index=root/'model_input/h9_source_index.json'
          if not index.exists():
              print('SHORT_HISTORY_SOURCE_HOLD: complete 68-source research archive absent; keep verified partial closes and H9 hard gate')
              sys.exit(0)
          ix=json.loads(index.read_bytes())
          target=ix['authoritative_target']
          source=root/'model_input'/('h9_source_'+target.replace('-','')+'.zip')
          if not source.exists():
              print('SHORT_HISTORY_SOURCE_HOLD: source ZIP missing, no fabricated estimates')
              sys.exit(0)
          output=root/'short_history_proxy'
          command=[sys.executable,'scripts/stock_short_history_research_proxy_v1_20261013.py',
              '--index',str(index),'--source-zip',str(source),'--output-dir',str(output),
              '--cutoff',target+'T08:09:30+08:00']
          run=subprocess.run(command,capture_output=True,text=True,check=True)
          print(run.stdout)
          rep=json.loads((output/'short_history_research_proxy.json').read_bytes())
          assert rep['ExpectedUniverse']==68 and len(rep['Rows'])==3
          assert rep['FormalEligible'] is False and rep['NaturalCredit']==rep['OOSCredit']==0
          assert all(r['FormalEligible'] is False and not r['CanonicalPredictionWritten'] for r in rep['Rows'])
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary,'a',encoding='utf8') as dest:
                  dest.write('\n## Short-history D1-D10 research only (no formal production seal)\n\n')
                  dest.write((output/'short_history_research_proxy.md').read_text(encoding='utf8'))
                  dest.write('\nNote: target 08:09:30 is only the prospective input eligibility boundary. It is NOT a ChatGPT PRECHECK_START/RunID/ForecastSHA seal.\n')
          PY
      - name: Classify 10-13 historical Yahoo regression by verified source session, not machine midnight
        if: always()
        id: archive_scope
        env:
          VERIFIED_RECOVERY_SOURCE_DAY: ${{ needs.source-recovery-decision.outputs.source_day }}
          RUN_TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          source_day=$(PYTHONPATH=scripts python - <<'PY' || true
          import datetime
          from stock_daily_prior_close_source_closure_v1_20261013 import runtime_day_gate
          try:
              print(runtime_day_gate(datetime.datetime.now(datetime.timezone.utc)).strftime('%Y%m%d'))
          except ValueError:
              print('SOURCE_DATE_WINDOW_HOLD')
          PY
          )
