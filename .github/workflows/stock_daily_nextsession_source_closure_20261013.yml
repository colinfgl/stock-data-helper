name: stock-daily-nextsession-68-source-closure
on:
  workflow_dispatch:
  schedule:
    - cron: '45 12 * * 1-5'
  push:
    branches: [stock-daily-nextsession-source-20261013, stock-source-ohlc-provenance-20261013, stock-native-symbol-name-20261013, stock-integrate-dividend-sidecar-20261013, stock-partial-source-fallback-20261013]
    paths:
      - '.github/workflows/stock_daily_nextsession_source_closure_20261013.yml'
      - 'scripts/stock_daily_prior_close_source_closure_v1_20261013.py'
      - 'scripts/stock_dividend_factor_reconciliation_v1_20261013.py'
      - 'scripts/stock_partial_source_fallback_v1_20261013.py'
permissions:
  contents: read
concurrency:
  group: stock-daily-source68-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-gate-unit-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run source-window/date/quote-hash fail-closed self-tests
        run: |
          mkdir -p source_gate_qa
          python -m py_compile scripts/stock_daily_prior_close_source_closure_v1_20261013.py
          python scripts/stock_daily_prior_close_source_closure_v1_20261013.py --self-test | tee source_gate_qa/32_tests.json
          python - <<'PY'
          import json
          x=json.load(open('source_gate_qa/32_tests.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==32
          assert x['scope']=='PUBLIC_SYNTHETIC_TESTS_ONLY_NO_PRIVATE_SOURCE_NO_FORMAL'
          PY
      - name: Validate optional dividend-factor research helper independently
        run: |
          python -m py_compile scripts/stock_dividend_factor_reconciliation_v1_20261013.py
          python scripts/stock_dividend_factor_reconciliation_v1_20261013.py --self-test > source_gate_qa/dividend15_tests.json
          python - <<'PY'
          import json
          a=json.load(open("source_gate_qa/dividend15_tests.json"))
          assert a["status"]=="PASS" and a["passed"]==a["total"]==15,a
          assert a["scope"]=="SYNTHETIC_NO_PRIVATE_INPUT_NO_FORMAL"
          PY
      - name: Validate 10 independent per-symbol fallback guards
        run: |
          python -m py_compile scripts/stock_partial_source_fallback_v1_20261013.py
          python scripts/stock_partial_source_fallback_v1_20261013.py --self-test > source_gate_qa/partial10_tests.json
          python - <<'PY'
          import json
          x=json.load(open('source_gate_qa/partial10_tests.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==10,x
          assert x['scope']=='SYNTHETIC_RESEARCH_ONLY_NO_FORMAL_NO_NATURAL'
          PY
      - name: Preserve reusable unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-daily-source68-gate-${{ github.run_id }}
          path: |
            source_gate_qa/
            scripts/stock_daily_prior_close_source_closure_v1_20261013.py
            scripts/stock_partial_source_fallback_v1_20261013.py
          retention-days: 30
          if-no-files-found: error
  collect-next-session-source:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: source-gate-unit-qa
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-only capture after Taipei close, ALL 68 codes
        id: closure
        continue-on-error: true
        run: |
          python scripts/stock_daily_prior_close_source_closure_v1_20261013.py --out stock_next_session_original_source --mode CAPTURE
      - name: Optional source-chart dividend-factor audit, nonblocking
        if: always()
        continue-on-error: true
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime,json,pathlib
          from stock_dividend_factor_reconciliation_v1_20261013 import reconcile
          root=pathlib.Path("stock_next_session_original_source_raw")
          out=pathlib.Path("stock_next_session_original_source")
          out.mkdir(exist_ok=True,parents=True)
          records=[]
          for f in sorted(root.glob("chart_*.json")):
              symbol=f.name[len("chart_"):-len(".json")]
              try:
                  q=reconcile(f.read_bytes(),symbol)
                  records.append({"Symbol":symbol,"Status":q["Status"],"RawSHA256":q["RawSHA256"],
                                  "DividendLabels":q["DividendLabels"],"Matched":q["Matched"],
                                  "ThresholdExcluded":q["ExcludedByCountingThreshold"],
                                  "Holds":q["Holds"],"Events":q["Events"]})
              except Exception as exc:
                  records.append({"Symbol":symbol,"Status":"HOLD_SOURCE_OR_SCHEMA","Error":str(exc)[:180]})
          status="RESEARCH_SIDE_CAR_68_SYMBOL_SCAN" if len(records)==68 else "RESEARCH_SIDE_CAR_PARTIAL_SOURCE"
          report={"Status":status,"SourceChartFilesScanned":len(records),
                  "VerifiedCharts":sum(x["Status"]=="RESEARCH_MATCHED" for x in records),
                  "ChartsWithHold":sum(x["Status"].startswith("HOLD") or x["Status"]=="RESEARCH_PARTIAL_HOLD" for x in records),
                  "ThresholdExcludedEvents":sum(x.get("ThresholdExcluded",0) for x in records),
                  "ReportGeneratedAtUTC":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "Records":records,"FormalEligible":False,"NaturalCredit":0,"OOSCredit":0,
                  "Note":"Nonblocking research-only exact source chart cohort. Can be used for discrepancy triage, never for issuer-exhaustive or future premarket prediction seal."}
          target=out/"dividend_factor_research_sidecar.json"
          target.write_text(json.dumps(report,ensure_ascii=False,indent=2,allow_nan=False)+"\n",encoding="utf8")
          print("SIDE_CAR:",report["Status"],"charts",len(records),
                "excluded dividend events",report["ThresholdExcludedEvents"])
          PY
      - name: Save 68-code verified partial market evidence independently
        if: always()
        continue-on-error: true
        run: |
          python scripts/stock_partial_source_fallback_v1_20261013.py --raw-dir stock_next_session_original_source_raw --output stock_next_session_original_source/verified_partial
      - name: Preserve all raw original bytes and all failed-symbol receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-next-session-68-source-raw-${{ github.run_id }}
          path: |
            stock_next_session_original_source/
            stock_next_session_original_source_raw/
            stock_next_session_original_source_calendar_source/
          retention-days: 30
          if-no-files-found: error
      - name: Gate exact 68 plus official bytes before claiming research source ready
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('stock_next_session_original_source/model_input/source_closure_readback.json')
          if not p.exists():
              print('SOURCE68_NOT_READY: inspect uploaded per-symbol/hold files; never relabel old days')
              sys.exit(2)
          x=json.loads(p.read_bytes())
          assert x['status']=='RESEARCH_SOURCE_68_OF_68_READY_NOT_FORMAL'
          assert x['ticker_count']==x['per_symbol_sha_count']==68
          assert x['taiex_ohlc_verified'] is True
          assert set(x['taiex_ohlc'])=={'open','high','low','close'}
          assert x['total_unique_original_raw_shas']==71
          assert x['full_official_symbol_names'] is True
          assert x['formal_input_qualified']==False and x['natural_credit']==x['oos_credit']==0
          print('RESEARCH_SOURCE_ONLY_READY; formal issuer/full H9 native forecast remains unqualified:',x['target_date'],x['source_date'])
          PY
      - name: Explicitly exclude production claims
        if: always()
        run: |
          echo "Source-only GH helper after close, NOT a second formal ChatGPT schedule." >> "$GITHUB_STEP_SUMMARY"
          echo "Successful exact-day TWSE+TPEx and verified TAIEX O/H/L/C plus 68 separate Yahoo SHA sources are required; green push CI is only synthetic QA." >> "$GITHUB_STEP_SUMMARY"
          echo "Provider bar asof uses original timestamp rather than a fabricated 13:30 publication timestamp." >> "$GITHUB_STEP_SUMMARY"
          echo "Symbol display names are from the same original first-party TWSE/TPEx file; Yahoo English shortName remains audit-only." >> "$GITHUB_STEP_SUMMARY"
          echo "Partial or stale provider source => fail job after preserving per-symbol status. No same-run ChatGPT ForecastSHA, formal/Natural/OOS or cash approval." >> "$GITHUB_STEP_SUMMARY"
          echo "Dividend-factor chart reconciliation is a separate nonblocking research sidecar; an eligible 68-source manifest is still determined only by the original hard gate." >> "$GITHUB_STEP_SUMMARY"
          echo "Independent per-symbol fallback preserves official name/close for valid symbols even when 1/68 adjusted chart fails. It supplies NO H9 model price for unqualified symbols and NO Formal/Natural/OOS credit." >> "$GITHUB_STEP_SUMMARY"
