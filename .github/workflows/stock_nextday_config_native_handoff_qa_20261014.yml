name: stock-nextday-config-native-handoff-qa
on:
  push:
    branches: [stock-nextday-native-config-handoff-20261014, stock-nextday-cutoff-stage-readback-20261014, stock-sealer-resume-pending-20261014, stock-config-owned-active-retry-contract-20261014]
    paths:
      - 'scripts/stock_nextday_config_native_handoff_v1_20261014.py'
      - 'scripts/stock_nextday_config_preseal_gate_v2_20261014.py'
      - '.github/workflows/stock_nextday_config_native_handoff_qa_20261014.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config-native-two-phase-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify next-day planner 40/40 including ACTIVE_OWNED authenticated lease
        run: |
          mkdir -p native_sealer_qa
          python scripts/stock_nextday_config_preseal_gate_v2_20261014.py --self-test --output native_sealer_qa/planner36.json
          python - <<'PY'
          import json
          x=json.load(open('native_sealer_qa/planner36.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==40,x
          PY
      - name: Verify exact 24-column native two-phase payload and 62 failure/positive guards
        run: |
          python -m py_compile scripts/stock_nextday_config_native_handoff_v1_20261014.py
          python scripts/stock_nextday_config_native_handoff_v1_20261014.py \
            --mode self-test --output native_sealer_qa/native_stage_readback.json
          python - <<'PY'
          import json
          x=json.load(open('native_sealer_qa/native_stage_readback.json'))
          assert x['status']=='PASS' and x['passed']==x['total']==62,x
          assert x['test_scope']=='SYNTHETIC_TWO_PHASE_CONNECTOR_REQUEST_NO_NATIVE_EXTERNAL_WRITE_NO_FORECAST_NATURAL'
          assert x['example_stage_request']['updateCells']['range']['sheetId']==508116522
          assert x['example_stage_request']['updateCells']['range']['startColumnIndex']==0
          assert x['example_stage_request']['updateCells']['range']['endColumnIndex']==24
          row=x['example_stage_request']['updateCells']['rows'][0]['values']
          assert len(row)==24 and row[2]['userEnteredValue']['stringValue']=='SEAL_PENDING_NATIVE_READBACK'
          commit=x['example_promotion_request']['updateCells']
          assert commit['range']['startColumnIndex']==2 and commit['range']['endColumnIndex']==3
          assert commit['rows'][0]['values'][0]['userEnteredValue']['stringValue']=='PRESEALED'
          print('62 cases; actual ACTIVE_OWNED source and same physical token; single-lease safe pending resume without duplicate append; post-08:10/future stamped receipts held; 24-cell pending stage; readback; one-cell activation; final readback; Natural/OOS=0')
          PY
      - name: Archive exact synthetic contract and stage request
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-sealer-native-two-phase-synthetic-${{ github.run_id }}
          path: native_sealer_qa/
          retention-days: 30
          if-no-files-found: warn
      - name: Separate test success from real Google Sheets and ChatGPT execution
        if: always()
        run: |
          echo "These tests do NOT issue a live Google Sheets write and do NOT establish 19:00 ChatGPT worker installation." >> "$GITHUB_STEP_SUMMARY"
          echo "Future formal PRESEALED requires real same-run prior settlement receipt/observability, activated sealer authority, owned native writer lease, live full canonical range, and full post-commit readback." >> "$GITHUB_STEP_SUMMARY"
          echo "The frozen 2026-10-14 08:10 past attempt remains HOLD; no synthetic test grants Formal/Natural/OOS." >> "$GITHUB_STEP_SUMMARY"
