name: Diagnose corporate action endpoints

on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose_corp_action_endpoints.py
      - .github/workflows/diagnose_corp_action_endpoints.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/diagnose_corp_action_endpoints.py
