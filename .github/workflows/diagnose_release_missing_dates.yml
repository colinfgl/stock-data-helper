name: Diagnose release missing dates

on:
  push:
    branches: [main]
    paths:
      - scripts/diagnose_release_missing_dates.py
      - .github/workflows/diagnose_release_missing_dates.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/diagnose_release_missing_dates.py
