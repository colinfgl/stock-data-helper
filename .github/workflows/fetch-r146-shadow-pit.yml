name: R146 Shadow Historical Research Backfill (unverified PIT)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-r146-shadow-pit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify historical publication-time guard
        run: python -m unittest discover -s tests -p 'test_fetch_r146_shadow_vintage_20261111.py'

      - name: Fetch TWSE historical research data (publication time unverified)
        run: python scripts/fetch_r146_shadow_pit.py

      - name: Show raw-history coverage (not PIT certification)
        run: cat output/r146_shadow/coverage.json

      - name: Commit research-only history outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/r146_shadow/
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update R146 historical shadow research dataset (PIT unverified)"
            git push
          fi
