name: historical-analog-v01

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_historical_analog_v01.py'
      - '.github/workflows/historical_analog_v01.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build breadth history and analog v0.1
        run: python scripts/build_historical_analog_v01.py
      - name: Commit research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/historical_analog_v01
          if git diff --cached --quiet; then
            echo 'No output changes.'
          else
            git commit -m 'Update historical analog v0.1 research outputs'
            git push
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: historical-analog-v01
          path: output/historical_analog_v01
          retention-days: 30
