name: B1 alternative adjusted-source evidence
on:
  workflow_dispatch:
    inputs:
      diagnostic_one:
        description: Capture only the first named historical source for diagnosis
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  capture-missing-records:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector syntax
        run: python -m py_compile scripts/b1_alternative_source_capture.py
      - name: Collect only named missing records without credentials or synthetic values
        env:
          DIAGNOSTIC_ONE: ${{ inputs.diagnostic_one }}
        run: |
          if [ "$DIAGNOSTIC_ONE" = "true" ]; then
            python scripts/b1_alternative_source_capture.py --out adjusted_source_evidence --diagnostic-one
          else
            python scripts/b1_alternative_source_capture.py --out adjusted_source_evidence
          fi
      - name: Preserve actual source code and checkout identity
        if: always()
        run: |
          mkdir -p adjusted_source_evidence
          cp scripts/b1_alternative_source_capture.py adjusted_source_evidence/collect.py
          git rev-parse HEAD > adjusted_source_evidence/checkout_sha.txt
          sha256sum scripts/b1_alternative_source_capture.py > adjusted_source_evidence/collector_sha256.txt
      - name: Preserve raw responses and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-alternative-adjusted-${{ github.run_id }}
          path: adjusted_source_evidence/
          if-no-files-found: error
          retention-days: 30
