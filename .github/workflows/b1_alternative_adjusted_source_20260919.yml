name: B1 alternative adjusted-source evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-missing-records:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect only named missing records without credentials or synthetic values
        run: |
          mkdir -p adjusted_source_evidence
          cat > adjusted_source_evidence/collect.py <<'PY'
          import concurrent.futures as cf,datetime as dt,hashlib,json,pathlib,urllib.request,urllib.parse
          root=pathlib.Path('adjusted_source_evidence')
          targets=[('0050','2026-09-17','2026-09-18'),('00400A','2026-09-17','2026-09-18'),('009820','2026-09-17','2026-09-18'),('2330','2025-08-01','2025-08-01')]
          def stamp():return dt.datetime.now(dt.timezone.utc).isoformat()
          def capture(t):
              code,start,end=t
              url='https://api.finmindtrade.com/api/v4/data?'+urllib.parse.urlencode({'dataset':'TaiwanStockPriceAdj','data_id':code,'start_date':start,'end_date':end})
              r={'code':code,'start_date':start,'end_date':end,'dataset':'TaiwanStockPriceAdj','url':url,'requested_at':stamp(),'attempts':1,'formal_qualified':False}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'B1-source-verification/1.0','Accept':'application/json'})
                  with urllib.request.urlopen(req,timeout=15) as f:b=f.read();r['http_status']=f.status
                  name=code+'_'+start+'.raw.json';(root/name).write_bytes(b)
                  r.update(path=name,sha256=hashlib.sha256(b).hexdigest(),bytes=len(b),received_at=stamp(),transport='FETCHED')
                  p=json.loads(b);rows=p.get('data',[])
                  r.update(provider_status=p.get('status'),provider_message=p.get('msg'),rows_received=len(rows) if isinstance(rows,list) else None)
                  if isinstance(rows,list):r['dates_received']=[x.get('date') for x in rows if isinstance(x,dict)]
              except Exception as e:r.update(transport='FAILED',error=str(e),received_at=stamp())
              return r
          start=stamp()
          with cf.ThreadPoolExecutor(max_workers=2) as pool:results=list(pool.map(capture,targets))
          receipt={'started_at':start,'completed_at':stamp(),'operation':'ALTERNATIVE_PROVIDER_RAW_EVIDENCE_ONLY','sources':results,'requests':4,'retries':0,'model_runs':0,'private_portfolio_included':False,'formal_input_qualified':False,'limitation':'Provider response is not validation. Preserve provenance and compare dates, raw official prices, history continuity and actions before any use.'}
          (root/'receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps(receipt,ensure_ascii=False))
          PY
          python adjusted_source_evidence/collect.py
      - name: Preserve raw responses and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-alternative-adjusted-${{ github.run_id }}
          path: adjusted_source_evidence/
          if-no-files-found: error
          retention-days: 30
