name: stock-source-20261013-one-shot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stock_source_20261013_once.yml'
permissions:
  contents: read
concurrency:
  group: stock-source-20261013-one-shot
  cancel-in-progress: false
jobs:
  acquire-public-originals:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[STOCK-1013-ONESHOT]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate standalone collector syntax
        run: python -m py_compile scripts/premarket_daily_inputs_3y_20261013.py
      - name: Fetch 10/12 official market data and 3y adjusted-close chart bytes for public 68-symbol universe
        env:
          SOURCE_SYMBOLS: '00400A.TW,0050.TW,009820.TW,1503.TW,1513.TW,1519.TW,2049.TW,2059.TW,2207.TW,2301.TW,2303.TW,2308.TW,2313.TW,2317.TW,2330.TW,2345.TW,2359.TW,2368.TW,2376.TW,2382.TW,2383.TW,2395.TW,2454.TW,2466.TW,2634.TW,2645.TW,2834.TW,2885.TW,3017.TW,3037.TW,3105.TWO,3138.TW,3163.TWO,3189.TW,3293.TWO,3324.TWO,3363.TWO,3443.TW,3450.TW,3481.TW,3491.TWO,3529.TWO,3653.TW,3661.TW,3665.TW,3711.TW,3718.TWO,4585.TW,4916.TW,4979.TWO,5222.TW,5274.TWO,5351.TWO,6223.TWO,6285.TW,6442.TW,6451.TW,6510.TWO,6515.TW,6526.TW,6669.TW,6753.TW,6770.TW,6781.TW,6831.TW,8033.TW,8046.TW,8147.TWO'
        shell: bash
        run: |
          python scripts/premarket_daily_inputs_3y_20261013.py \
            --out public_input_20261013 \
            --target-date 2026-10-13 \
            --symbols "$SOURCE_SYMBOLS"
      - name: Preserve all official/raw provider originals, source digests, and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-public-input-20261013-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public_input_20261013/
            scripts/premarket_daily_inputs_3y_20261013.py
          if-no-files-found: error
          retention-days: 90
      - name: State truthful eligibility
        if: always()
        run: |
          echo 'Stock 2026-10-13 one-shot source research: does not place trades, generate Formal predictions, or qualify Natural/OOS. Unverified adjusted history, corporate actions, or date/venue conflicts remain HOLD per symbol.' >> "$GITHUB_STEP_SUMMARY"
