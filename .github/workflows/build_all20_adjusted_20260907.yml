name: Build all20 adjusted through 2026-09-07

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_all20_adjusted_20260907.py'
      - '.github/workflows/build_all20_adjusted_20260907.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Restore exact R45 base artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33166573845 -n all20-adjusted-v2b-20260828 -D scripts/r45_base
      - name: Build canonical extension
        working-directory: scripts
        run: python build_all20_adjusted_20260907.py
      - name: Upload extension artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all20-adjusted-through-20260907
          path: scripts/output_all20_20260907/
          if-no-files-found: error
          retention-days: 90
