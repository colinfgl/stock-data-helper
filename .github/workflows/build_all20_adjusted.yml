name: Build all 20 adjusted OHLC

on:
  push:
    branches: [main]
    paths:
      - scripts/build_all20_adjusted.py
      - .github/workflows/build_all20_adjusted.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-all20:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Build unified 20-stock dataset
        run: python scripts/build_all20_adjusted.py
      - name: Upload all20 artifact
        uses: actions/upload-artifact@v4
        with:
          name: all20-adjusted-20260828
          path: output_all20/
          if-no-files-found: error
