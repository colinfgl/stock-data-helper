name: recovery-adjusted-prices-20260915
on:
  push:
    branches: [recovery-inputs-20260915]
    paths: [.github/workflows/recovery_adjusted_prices_20260915.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve public closing-price evidence only
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json,pathlib,urllib.request,urllib.parse,concurrent.futures,datetime,hashlib
          p=pathlib.Path('evidence'); now=lambda:datetime.datetime.now(datetime.timezone.utc).isoformat()
          symbols='00400A.TW 0050.TW 009820.TW 1503.TW 1504.TW 1513.TW 1519.TW 1597.TW 2049.TW 2059.TW 2207.TW 2231.TW 2301.TW 2303.TW 2308.TW 2313.TW 2314.TW 2317.TW 2330.TW 2345.TW 2359.TW 2367.TW 2368.TW 2371.TW 2376.TW 2382.TW 2383.TW 2395.TW 2439.TW 2454.TW 2458.TW 2466.TW 2471.TW 2630.TW 2634.TW 2645.TW 2834.TW 2885.TW 3004.TW 3017.TW 3019.TW 3029.TW 3037.TW 3105.TWO 3138.TW 3163.TWO 3189.TW 3211.TWO 3227.TWO 3293.TWO 3324.TWO 3363.TWO 3443.TW 3450.TW 3481.TW 3491.TWO 3529.TWO 3653.TW 3661.TW 3665.TW 3711.TW 4540.TW 4541.TWO 4572.TW 4583.TW 4585.TW 4916.TW 4931.TWO 4953.TWO 4958.TW 4979.TWO 5222.TW 5274.TWO 5351.TWO 6112.TW 6166.TW 6188.TWO 6214.TW 6223.TWO 6282.TW 6285.TW 6412.TW 6414.TW 6442.TW 6451.TW 6510.TWO 6515.TW 6526.TW 6669.TW 6689.TW 6752.TWO 6753.TW 6770.TW 6781.TW 6831.TW 6874.TWO 7402.TWO 8033.TW 8046.TW 8086.TWO 8147.TWO 8222.TW ^TWII'.split()
          start=int(datetime.datetime(2026,9,1,tzinfo=datetime.timezone.utc).timestamp())
          end=int(datetime.datetime(2026,9,15,tzinfo=datetime.timezone.utc).timestamp())
          def fetch(symbol):
            code='TAIEX' if symbol=='^TWII' else symbol.split('.')[0]
            rec={'name':'price_'+code,'symbol':symbol,'started_at':now(),'attempts':[]}
            for host in ['query1.finance.yahoo.com','query2.finance.yahoo.com']:
              url='https://'+host+'/v8/finance/chart/'+urllib.parse.quote(symbol,safe='')+'?'+urllib.parse.urlencode({'period1':start,'period2':end,'interval':'1d','events':'div,splits'})
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}),timeout=15) as response:
                  data=response.read();status=response.status
                obj=json.loads(data);result=obj['chart']['result'][0]
                assert result['meta']['symbol']==symbol,'symbol mismatch'
                assert result.get('timestamp'),'missing price timestamps'
                path=p/('price_'+code+'.json');path.write_bytes(data)
                rec.update(status='retrieved',url=url,retrieved_at=now(),sha256=hashlib.sha256(data).hexdigest(),bytes=len(data),http_status=status,path=str(path),max_timestamp=max(result['timestamp']))
                return rec
              except Exception as exc:rec['attempts'].append({'url':url,'error':str(exc),'observed_at':now()})
            rec.update(status='failed',completed_at=now());return rec
          started=now()
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:logs=list(pool.map(fetch,symbols))
          receipt={'started_at':started,'completed_at':now(),'intended_last_session':'2026-09-14','excluded_intraday_date':'2026-09-15','scope':'Public input recovery; dates, corporate actions, and official-price agreement require downstream verification. No portfolio, model, forecast, or credentials included.','sources':logs}
          (p/'fetch_receipt.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2))
          print(json.dumps({'requested':len(logs),'retrieved':sum(x['status']=='retrieved' for x in logs),'failed':[x['name'] for x in logs if x['status']!='retrieved']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: adjusted-prices-20260914-recovery
          path: evidence/
          retention-days: 30
          if-no-files-found: error
