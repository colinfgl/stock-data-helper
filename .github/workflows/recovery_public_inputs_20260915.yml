name: recovery-public-inputs-20260915
on:
  push:
    branches: [recovery-inputs-20260915]
    paths: [.github/workflows/recovery_public_inputs_20260915.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public data only; no portfolio or model changes
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json, pathlib, urllib.request, concurrent.futures, datetime, hashlib, time
          p=pathlib.Path('evidence')
          now=lambda: datetime.datetime.now(datetime.timezone.utc).isoformat()
          jobs={
            'index':'https://www.twse.com.tw/exchangeReport/FMTQIK?response=json&date=20260914',
            'listed_20260914':'https://www.twse.com.tw/exchangeReport/MI_INDEX?response=json&date=20260914&type=ALLBUT0999',
            'listed_20260911':'https://www.twse.com.tw/exchangeReport/MI_INDEX?response=json&date=20260911&type=ALLBUT0999',
            'otc_20260914':'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026%2F09%2F14&id=&response=json',
            'otc_20260911':'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026%2F09%2F11&id=&response=json',
            'otc_legacy':'https://www.tpex.org.tw/web/stock/aftertrading/daily_close_quotes/stk_quote_result.php?l=zh-tw&d=115/09/14&o=json',
            'calendar':'https://www.twse.com.tw/holidaySchedule/holidaySchedule?response=json&queryYear=115',
            'twse_actions':'https://www.twse.com.tw/exchangeReport/TWT49U?response=json&startDate=20260911&endDate=20260914',
            'tpex_actions':'https://www.tpex.org.tw/www/zh-tw/bulletin/exDailyQ?date=2026%2F09%2F14&response=json',
            'tpex_openapi':'https://www.tpex.org.tw/openapi/v1/tpex_mainboard_quotes'
          }
          def f(item):
            name,url=item
            log={'name':name,'url':url,'started_at':now(),'attempts':[]}
            for attempt in range(2):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=20) as r:
                  data=r.read(); status=r.status
                file=p/(name+'.json');file.write_bytes(data)
                obj=json.loads(data)
                log.update(status='retrieved',retrieved_at=now(),http_status=status,sha256=hashlib.sha256(data).hexdigest(),bytes=len(data),path=str(file),top_keys=list(obj)[:15] if isinstance(obj,dict) else ['list'])
                return log
              except Exception as e:
                log['attempts'].append({'attempt':attempt+1,'observed_at':now(),'error':str(e)})
            log.update(status='failed',completed_at=now())
            return log
          started=now()
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
            logs=list(pool.map(f,jobs.items()))
          (p/'fetch_receipt.json').write_text(json.dumps({'started_at':started,'completed_at':now(),'intended_data_date':'2026-09-14','purpose':'Public market input recovery only; payload dates require downstream validation','sources':logs},ensure_ascii=False,indent=2))
          print(json.dumps(logs,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-market-inputs-20260914-recovery
          path: evidence/
          retention-days: 30
          if-no-files-found: error
