name: Apply corporate-action adjustments

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_adjustments.py
      - .github/workflows/apply_adjustments.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjust-last3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply adjustments and QA
        shell: bash
        run: |
          set +e
          python scripts/apply_adjustments.py
          status=$?
          set -e
          echo "$status" > output/adjustment_exit_code.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if ! git diff --cached --quiet; then
            git commit -m "Apply corporate-action adjustments and QA"
            git push
          fi
          exit "$status"
