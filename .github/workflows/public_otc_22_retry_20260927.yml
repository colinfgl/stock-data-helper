name: Public OTC 22 one retry
on:
  push:
    branches: [data-recovery/public-market-20260927]
    paths: [.github/workflows/public_otc_22_retry_20260927.yml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fetch one public source
        run: |
          mkdir -p public
          python3 - <<'PY'
          import urllib.request,json,hashlib,pathlib,datetime
          p=pathlib.Path('public');u='https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026/09/22&id=&response=json';r={'path':'tpex_20260922.json','url':u,'format':'TPEX_DAILY_QUOTES_JSON','retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
              with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Accept-Encoding':'identity'}),timeout=45) as f:
                  b=f.read();r.update(http_status=f.status,final_url=f.url,headers=dict(f.headers))
              json.loads(b);(p/r['path']).write_bytes(b);r.update(bytes=len(b),sha256=hashlib.sha256(b).hexdigest())
          except Exception as e:r['error']=str(e)
          (p/'manifest.json').write_text(json.dumps({'records':[r]},ensure_ascii=False,indent=2));print(json.dumps(r))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-otc-22-retry-20260927
          path: public
          retention-days: 30
