name: Full 20-stock raw QA

on:
  push:
    branches: [main]
    paths:
      - scripts/full20_qa.py
      - .github/workflows/full20_qa.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full20-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Rebuild and QA all 20 symbols
        shell: bash
        run: |
          set +e
          python scripts/full20_qa.py
          status=$?
          set -e
          echo "$status" > output/full20_qa_exit_code.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if ! git diff --cached --quiet; then
            git commit -m "Run full 20-stock raw market-data QA"
            git push
          fi
          exit "$status"
