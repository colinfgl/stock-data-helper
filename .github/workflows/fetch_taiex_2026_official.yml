name: fetch-taiex-2026-official

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_taiex_2026_official.py'
      - '.github/workflows/fetch_taiex_2026_official.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official TAIEX 2025-2026
        run: python scripts/fetch_taiex_2026_official.py
      - name: Commit official TAIEX outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add output/taiex_2026_official.csv output/taiex_2025_2026_official.csv
          git diff --cached --quiet || git commit -m 'Update official TAIEX PIT history through 2026-09-08'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: taiex-official-pit-through-20260908
          path: |
            output/taiex_2026_official.csv
            output/taiex_2025_2026_official.csv
          retention-days: 30
