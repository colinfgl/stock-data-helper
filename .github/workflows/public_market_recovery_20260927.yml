name: Public market originals recovery 20260927
on:
  push:
    branches: [data-recovery/public-market-20260927]
    paths: [.github/workflows/public_market_recovery_20260927.yml]
permissions:
  contents: read
jobs:
  fetch-public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public exchange originals
        shell: bash
        run: |
          mkdir -p public_raw
          python3 - <<'PY'
          import urllib.request, json, hashlib, datetime, pathlib, time, concurrent.futures
          root=pathlib.Path('public_raw')
          jobs=[]
          for d in ['20260921','20260922','20260923','20260924']:
              jobs.append((f'twse_{d}.json',f'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date={d}&type=ALLBUT0999&response=json'))
              sd=f'{d[:4]}/{d[4:6]}/{d[6:]}'
              jobs.append((f'tpex_{d}.json',f'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date={sd}&id=&response=json'))
          jobs.extend([
              ('taiex_202609.json','https://www.twse.com.tw/rwd/zh/afterTrading/MI_5MINS_HIST?date=20260924&response=json'),
              ('holiday_2026.json','https://www.twse.com.tw/rwd/zh/holidaySchedule/holidaySchedule?response=json&queryYear=2026'),
          ])
          def get(job):
              name,url=job;rec={'path':name,'url':url,'started_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              for attempt in range(2):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=35) as r: raw=r.read();status=r.status;headers=dict(r.headers)
                      (root/name).write_bytes(raw)
                      rec.update(http_status=status,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),headers=headers,attempt=attempt+1,retrieved_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
                      try:
                          obj=json.loads(raw);rec['response_stat']=obj.get('stat');rec['response_date']=obj.get('date')
                      except Exception as e:rec['parse_error']=str(e)
                      return rec
                  except Exception as e:rec['error']=str(e);time.sleep(1)
              return rec
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex: records=list(ex.map(get,jobs))
          (root/'transport_manifest.json').write_text(json.dumps({'scope':'PUBLIC_EXCHANGE_ORIGINALS_ONLY','records':records},ensure_ascii=False,indent=2),encoding='utf-8')
          for r in records: print(r['path'],r.get('http_status'),r.get('response_stat'),r.get('bytes'),r.get('error',''))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-market-recovery-20260927
          path: public_raw
          retention-days: 30
