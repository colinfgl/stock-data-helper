name: Public index and IR originals 20260927
on:
  push:
    branches: [data-recovery/public-market-20260927]
    paths: [.github/workflows/public_index_ir_20260927.yml]
permissions:
  contents: read
jobs:
  fetch-public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect public sources
        shell: bash
        run: |
          mkdir -p public_index_ir
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,hashlib,datetime,pathlib,concurrent.futures
          root=pathlib.Path('public_index_ir')
          jobs=[('taiex_202609.json','https://www.twse.com.tw/rwd/zh/indicesReport/MI_5MINS_HIST?date=20260924&response=json'),('avc_financial.pdf','https://www.avc.co/Portals/0/zh-tw/FileUpload/投資人專區/年度及期中財務報告/FinancialReports.pdf'),('accton_reports.html','https://www.accton.com/tw/annual/')]
          def get(job):
              name,url=job;url=urllib.parse.quote(url,safe=':/?=&%');r={'path':name,'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40) as h: raw=h.read();r.update(http_status=h.status,headers=dict(h.headers),final_url=h.url)
                  (root/name).write_bytes(raw);r.update(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
              except Exception as e:r['error']=str(e)
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as ex: rows=list(ex.map(get,jobs))
          (root/'manifest.json').write_text(json.dumps({'records':rows},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rows,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-index-ir-20260927
          path: public_index_ir
          retention-days: 30
