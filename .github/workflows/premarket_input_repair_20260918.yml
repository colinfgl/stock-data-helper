name: premarket-input-repair-20260918
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/premarket_input_repair_20260918.yml'
permissions:
  contents: read
jobs:
  recover-public-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch bounded official public market inputs
        run: |
          python - <<'PY'
          import concurrent.futures, datetime, hashlib, json, pathlib, time, urllib.request
          out=pathlib.Path('official_input_recovery_20260918');out.mkdir()
          jobs={
            'FMTQIK_202609.json':'https://www.twse.com.tw/rwd/zh/afterTrading/FMTQIK?date=20260917&response=json',
            'TAIEX_OHLC_202609.json':'https://www.twse.com.tw/indicesReport/MI_5MINS_HIST?date=20260917&response=json',
            'TWSE_0917.json':'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20260917&type=ALLBUT0999&response=json',
            'TWSE_0918.json':'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20260918&type=ALLBUT0999&response=json',
            'TPEX_0917.json':'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026%2F09%2F17&id=&response=json',
            'TPEX_0918.json':'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026%2F09%2F18&id=&response=json',
            'actions_0917_0918.json':'https://www.twse.com.tw/exchangeReport/TWT49U?response=json&startDate=20260917&endDate=20260918',
            'tpex_actions_0917_0918.json':'https://www.tpex.org.tw/www/zh-tw/bulletin/exDailyQ?startDate=2026%2F09%2F17&endDate=2026%2F09%2F18&response=json'
          }
          def fetch(item):
            name,url=item;attempts=[]
            for i in range(2):
              start=datetime.datetime.now(datetime.timezone.utc).isoformat()
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 official-input-recovery/1.0','Accept':'application/json'})
                with urllib.request.urlopen(req,timeout=18) as r:
                  body=r.read();status=r.status
                (out/name).write_bytes(body);data=json.loads(body)
                valid=isinstance(data,dict) and str(data.get('stat','')).lower()=='ok'
                attempts.append({'started_at':start,'status':status,'bytes':len(body),'json_stat':data.get('stat')})
                if valid:return {'name':name,'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sha256':hashlib.sha256(body).hexdigest(),'status':'RAW_OK_NEEDS_DATE_VALIDATION','attempts':attempts}
              except Exception as e:attempts.append({'started_at':start,'error':str(e)})
              time.sleep(1)
            return {'name':name,'url':url,'status':'FETCH_FAIL','attempts':attempts}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(fetch,jobs.items()))
          report={'purpose':'Public-data transport recovery only; not a forecast or a historical point-in-time claim','generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':results,'all_fetched':all(r['status'].startswith('RAW_OK') for r in results)}
          (out/'fetch_manifest.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps({'all_fetched':report['all_fetched'],'files':[(r['name'],r['status']) for r in results]}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-input-recovery-20260918
          path: official_input_recovery_20260918/
          retention-days: 30
