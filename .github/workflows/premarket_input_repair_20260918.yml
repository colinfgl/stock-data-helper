name: premarket-input-repair-20260918
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [normal, repair, actions]
        default: normal
      target_date:
        description: 'YYYY-MM-DD; auto is commissioning only, not a live prediction'
        required: false
        default: auto
      symbols:
        description: 'Public tickers only; repair accepts one failed ticker'
        required: false
        default: '2330.TW,0050.TW,5274.TWO'
      baseline_run:
        description: 'Exact prior public acquisition run, repair only'
        required: false
      baseline_artifact:
        description: 'Exact immutable artifact ID, repair only'
        required: false
      baseline_receipt_sha:
        description: 'Expected SHA256 of acquisition_receipt.json, repair only'
        required: false
      action_start:
        description: 'YYYY-MM-DD; actions mode only'
        required: false
  push:
    paths:
      - '.github/workflows/premarket_input_repair_20260918.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: premarket-public-input-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover-public-inputs:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[B1-actions-commission]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact public baseline without re-querying successful sources
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'repair'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.baseline_artifact }}
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: restored_public
          merge-multiple: true
      - name: Targeted native data repair
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'repair'
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          SYMBOL: ${{ inputs.symbols }}
          RECEIPT_SHA: ${{ inputs.baseline_receipt_sha }}
        run: |
          python scripts/premarket_targeted_sources.py --baseline restored_public/official_daily_inputs --receipt-sha "$RECEIPT_SHA" --symbol "$SYMBOL" --target "$TARGET_DATE" --out targeted_inputs
      - name: Missing action categories only
        if: github.event_name == 'push' || inputs.mode == 'actions'
        env:
          START_DATE: ${{ github.event_name == 'push' && '2026-09-17' || inputs.action_start }}
          END_DATE: ${{ github.event_name == 'push' && '2026-09-21' || inputs.target_date }}
        run: |
          python scripts/premarket_action_sources.py --start "$START_DATE" --end "$END_DATE" --out action_inputs
      - name: Normal date-aware public acquisition
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'normal'
        env:
          TARGET_DATE: ${{ inputs.target_date || 'auto' }}
          SYMBOLS: ${{ inputs.symbols || '2330.TW,0050.TW,5274.TWO' }}
        run: |
          python scripts/premarket_daily_inputs.py --out official_daily_inputs --target-date "$TARGET_DATE" --symbols "$SYMBOLS"
      - name: Preserve exact data and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-public-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            official_daily_inputs/
            targeted_inputs/
            action_inputs/
            scripts/premarket_daily_inputs.py
            scripts/premarket_targeted_sources.py
            scripts/premarket_action_sources.py
          retention-days: 30
          if-no-files-found: error
      - name: State scope
        if: always()
        run: |
          echo 'Public acquisition only. Preserve raw failures. Native price validity or action transport alone is not full formal input qualification, model success, or user delivery. No private portfolio or model is uploaded.' >> "$GITHUB_STEP_SUMMARY"
