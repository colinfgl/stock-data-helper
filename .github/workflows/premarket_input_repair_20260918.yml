name: premarket-input-repair-20260918
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'YYYY-MM-DD; auto is next annual-calendar session for commissioning, not a live prediction'
        required: false
        default: 'auto'
      symbols:
        description: 'Public tickers only, comma separated; do not submit holdings, costs or credentials'
        required: false
        default: '2330.TW,0050.TW,5274.TWO'
  push:
    paths:
      - '.github/workflows/premarket_input_repair_20260918.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: premarket-public-input-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover-public-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve actual session and collect raw public inputs
        env:
          TARGET_DATE: ${{ inputs.target_date || 'auto' }}
          SYMBOLS: ${{ inputs.symbols || '2330.TW,0050.TW,5274.TWO' }}
        run: |
          python scripts/premarket_daily_inputs.py --out official_daily_inputs --target-date "$TARGET_DATE" --symbols "$SYMBOLS"
      - name: Preserve exact inputs and failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-public-input-${{ github.run_id }}
          path: |
            official_daily_inputs/
            scripts/premarket_daily_inputs.py
          retention-days: 30
          if-no-files-found: error
      - name: Explain scope without declaring model success
        if: always()
        run: |
          echo 'Public acquisition only: no model, no portfolio, no prediction. Transport PASS is not formal input qualification or user delivery PASS.' >> "$GITHUB_STEP_SUMMARY"
