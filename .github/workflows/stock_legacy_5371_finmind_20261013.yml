name: stock-5371-finmind-adjusted-history-shadow-20261013
on:
  workflow_dispatch:
  push:
    branches: [stock-5371-3718-source-recovery-20261013]
    paths:
      - '.github/workflows/stock_legacy_5371_finmind_20261013.yml'
permissions:
  contents: read
concurrency:
  group: stock-5371-finmind-oneoff-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check code and fail-closed provenance controls
        run: |
          python -m py_compile scripts/stock_legacy_5371_finmind_shadow_20261013.py
          python scripts/stock_legacy_5371_finmind_shadow_20261013.py --self-test
      - name: Capture raw adjusted and unadjusted retired stock history
        continue-on-error: true
        run: python scripts/stock_legacy_5371_finmind_shadow_20261013.py --output stock_legacy_finmind_shadow_20261013
      - name: Preserve retrieved bytes or exact missing reason
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-legacy-5371-finmind-research-${{ github.run_id }}
          path: |
            stock_legacy_finmind_shadow_20261013/
            scripts/stock_legacy_5371_finmind_shadow_20261013.py
          retention-days: 30
          if-no-files-found: error
      - name: Source-tier contract
        if: always()
        run: |
          echo "Provider FinMind is not TPEx; adjusted history remains research-only until action/issuer approval." >> "$GITHUB_STEP_SUMMARY"
          echo "Original 2026-08-21 TPEx last close 83.50 is a separately SHA-verified first-party source." >> "$GITHUB_STEP_SUMMARY"
          echo "Formal/Natural/OOS, current Config, trades and user portfolio are unchanged." >> "$GITHUB_STEP_SUMMARY"
