name: coverage-h8-final-20260922
on:
  push:
    branches: ['repair/public-gaps-20260922']
    paths: ['.github/workflows/coverage_h8_final_20260922.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Collect missing public sources only
        shell: python
        run: |
          import gzip,pathlib,json,urllib.request,hashlib,datetime,concurrent.futures,time
          P=pathlib.Path('out');P.mkdir()
          JOBS=[('otc_daily_20260603.json', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026/06/03&id=&response=json'), ('otc_daily_20260618.json', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026/06/18&id=&response=json'), ('otc_daily_20260622.json', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026/06/22&id=&response=json'), ('otc_daily_20260702.json', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026/07/02&id=&response=json'), ('otc_daily_20260720.json', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026/07/20&id=&response=json'), ('otc_daily_20260812.json', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026/08/12&id=&response=json'), ('otc_daily_20260813.json', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026/08/13&id=&response=json'), ('otc_daily_20260814.json', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026/08/14&id=&response=json'), ('otc_daily_20260831.json', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026/08/31&id=&response=json'), ('otc_daily_20260911.json', 'https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2026/09/11&id=&response=json'), ('otc_index_openapi.json', 'https://www.tpex.org.tw/openapi/v1/tpex_index')]
          def get(job):
           name,url=job;r=dict(name=name,url=url,status='FAILED',retrieved_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Connection':'close','Accept-Encoding':'identity'}),timeout=20) as f:
             chunks=[]
             while True:
              chunk=f.read(65536)
              if not chunk:break
              chunks.append(chunk)
             b=b"".join(chunks)
            packed=gzip.compress(b,mtime=0);r['name']=name+'.gz';(P/r['name']).write_bytes(packed);r.update(sha256=hashlib.sha256(packed).hexdigest(),raw_sha256=hashlib.sha256(b).hexdigest(),bytes=len(b))
            j=json.loads(b);r.update(status='FETCHED',payload_status=j.get('stat') if isinstance(j,dict) else 'ARRAY')
           except Exception as e:r['error']=str(e)
           time.sleep(.3);return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=1) as pool:rows=list(pool.map(get,JOBS))
          (P/'receipt.json').write_text(json.dumps({'sources':rows},ensure_ascii=False,indent=2))
          print(json.dumps({'requested':len(rows),'fetched':sum(x['status']=='FETCHED' for x in rows),'failed':[x for x in rows if x['status']!='FETCHED']}))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-h8-final-20260922
          path: out/
          retention-days: 30
