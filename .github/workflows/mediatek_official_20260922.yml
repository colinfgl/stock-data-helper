name: mediatek-official-20260922
on:
  push:
    branches: ['repair/public-gaps-20260922']
    paths: ['.github/workflows/mediatek_official_20260922.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch four official monthly public files
        shell: python
        run: |
          import urllib.request,json,pathlib,hashlib,datetime,concurrent.futures
          p=pathlib.Path('out');p.mkdir()
          def get(month):
              name=f'price_2454_{month}.json'
              url=f'https://www.twse.com.tw/rwd/zh/afterTrading/STOCK_DAY?date={month}&stockNo=2454&response=json'
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as r:b=r.read()
              j=json.loads(b)
              assert j['stat']=='OK' and j['date']==month
              (p/name).write_bytes(b)
              return dict(name=name,url=url,status='FETCHED',sha256=hashlib.sha256(b).hexdigest(),retrieved_at=datetime.datetime.now(datetime.timezone.utc).isoformat())
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool: rows=list(pool.map(get,['20260601','20260701','20260801','20260901']))
          (p/'receipt.json').write_text(json.dumps({'sources':rows},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: mediatek-official-20260922
          path: out/
          retention-days: 30
