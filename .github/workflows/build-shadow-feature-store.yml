name: build-shadow-feature-store

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'output/r146_shadow/stocks_daily.csv'
      - 'output/r146_shadow/taiex_daily.csv'
      - 'scripts/build_shadow_feature_store.py'
      - '.github/workflows/build-shadow-feature-store.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Build canonical PIT matrix
        run: python scripts/build_shadow_feature_store.py
      - name: Commit feature-store outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/shadow_feature_store/
          if git diff --cached --quiet; then
            echo "No feature-store output changes"
          else
            git commit -m "Update canonical shadow PIT feature store"
            git push
          fi
