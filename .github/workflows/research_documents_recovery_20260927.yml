name: research-documents-recovery-20260927
on:
  push:
    branches: [main]
    paths: [.github/workflows/research_documents_recovery_20260927.yml]
permissions:
  contents: read
jobs:
  public-ir:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Retrieve exact official documents
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,html.parser,json,pathlib,hashlib,datetime,concurrent.futures,re
          root=pathlib.Path('ir-exact');root.mkdir()
          seeds={'airoha_q2':'https://www.airoha.com/files/uploads/Airoha/FinancialReports/2026/202602_6526_AI1.pdf','avc_finance':'https://www.avc.co/投資人專區/財務資訊','avc_script':'https://www.avc.co/Portals/_default/Skins/Porto/test_script.js?ver=2026072001'}
          def fetch(item):
              key,url=item;url=urllib.parse.quote(url,safe=':/?=%&()');r={'key':key,'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as p:
                      raw=p.read(20000001);r.update(http_status=p.status,final_url=p.geturl())
                  if len(raw)>20000000:raise ValueError('OVERSIZE')
                  ext='.pdf' if raw.startswith(b'%PDF') else '.txt';path=key+ext;(root/path).write_bytes(raw);r.update(path=path,sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),status='SAVED_UNREVIEWED')
                  if ext!='.pdf':
                      text=raw.decode('utf-8',errors='replace');r['links']=re.findall(r'''(?:href|src)\s*=\s*[\"']([^\"']+)[\"']''',text,re.I)
              except Exception as e:r.update(status='ERROR',error=repr(e))
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as p:rows=list(p.map(fetch,seeds.items()))
          print(json.dumps(rows,ensure_ascii=False));(root/'manifest.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-ir-exact-20260927
          path: ir-exact/
          retention-days: 90
