name: research-documents-recovery-20260927
on:
  push:
    branches: [main]
    paths: [.github/workflows/research_documents_recovery_20260927.yml]
permissions:
  contents: read
jobs:
  public-ir:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Retrieve official IR indexes with source timestamps
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,pathlib,hashlib,datetime,concurrent.futures,re,html
          root=pathlib.Path('ir-indexes');root.mkdir()
          seeds={'yuanta_reports':'https://www.yuanta.com/TW/IR/Financials/Financial-Reports','yuanta_presentations':'https://www.yuanta.com/TW/IR/Financials/Presentations-and-Events','igs_reports':'https://www.igs.com.tw/investors/reports/67/','bizlink_financial':'https://www.bizlinktech.com/financial-information','accton_reports':'https://www.accton.com/tw/annual/'}
          def fetch(item):
              key,url=item;url=urllib.parse.quote(url,safe=':/?=%&()');r={'key':key,'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as p:
                      raw=p.read(20000001);r.update(http_status=p.status,final_url=p.geturl(),content_type=p.headers.get('Content-Type'),last_modified=p.headers.get('Last-Modified'))
                  if len(raw)>20000000:raise ValueError('OVERSIZE')
                  ext='.pdf' if raw.startswith(b'%PDF') else '.html';path=key+ext;(root/path).write_bytes(raw);r.update(path=path,sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),status='SAVED_UNREVIEWED')
                  if ext!='.pdf':
                      text=raw.decode('utf-8',errors='replace');r['links']=list(dict.fromkeys(urllib.parse.urljoin(url,html.unescape(x)) for x in re.findall(r'''(?:href|src)\s*=\s*[\"']([^\"']+)[\"']''',text,re.I)))
                      r['document_contexts']=[text[max(0,m.start()-200):min(len(text),m.end()+300)] for m in list(re.finditer(r'\.pdf|2026|115年|202602|2Q26|2Q2026|Q2',text,re.I))[:120]]
              except Exception as e:r.update(status='ERROR',error=repr(e))
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as p:rows=list(p.map(fetch,seeds.items()))
          (root/'manifest.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps([{k:v for k,v in r.items() if k not in ('links','document_contexts')} for r in rows],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-ir-indexes-20260927-2008
          path: ir-indexes/
          retention-days: 90
