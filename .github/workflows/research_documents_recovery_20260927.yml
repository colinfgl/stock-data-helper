name: research-documents-recovery-20260927
on:
  push:
    branches: [main]
    paths: [.github/workflows/research_documents_recovery_20260927.yml]
permissions:
  contents: read
jobs:
  public-ir:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve exact official report locator
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,pathlib,hashlib,datetime
          root=pathlib.Path('accton-official');root.mkdir()
          url='https://doc.twse.com.tw/server-java/t57sb01?step=1&colorchg=1&co_id=2345&year=115&mtype=A'
          r={'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=35) as p:
                  raw=p.read(20000001);r.update(http_status=p.status,final_url=p.geturl(),content_type=p.headers.get('Content-Type'))
              if len(raw)>20000000:raise ValueError('OVERSIZE')
              (root/'listing.html').write_bytes(raw);r.update(path='listing.html',sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),status='SAVED_UNREVIEWED')
              print(raw.decode('utf-8',errors='replace')[:15000])
          except Exception as e:r.update(status='ERROR',error=repr(e))
          (root/'manifest.json').write_text(json.dumps(r,ensure_ascii=False,indent=2),encoding='utf-8');print(json.dumps(r,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accton-official-locator-20260927-2017
          path: accton-official/
          retention-days: 90
