name: research-documents-recovery-20260927
on:
  push:
    branches: [main]
    paths: [.github/workflows/research_documents_recovery_20260927.yml]
permissions:
  contents: read
jobs:
  public-ir:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Retrieve public IR originals only
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,html.parser,json,pathlib,hashlib,re,concurrent.futures,datetime
          root=pathlib.Path('ir-originals');root.mkdir()
          seeds={'airoha':'https://www.airoha.com/investors/finance/statements','kinsus':'https://www.kinsus.com.tw/en/annual/monthly_revenue','accton':'https://www.accton.com/tw/monthly-merge/','avc':'https://www.avc.co/en-us/'}
          class Links(html.parser.HTMLParser):
              def __init__(self):super().__init__();self.links=[];self.current=None
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='a' and a.get('href'):self.current={'href':a['href'],'text':''};self.links.append(self.current)
              def handle_data(self,data):
                  if self.current is not None:self.current['text']+=data
              def handle_endtag(self,tag):
                  if tag=='a':self.current=None
          def run(item):
              company,start=item;folder=root/company;folder.mkdir();records=[];queue=[(start,0)];seen=set()
              while queue and len(seen)<12:
                  url,depth=queue.pop(0)
                  if url in seen:continue
                  seen.add(url);r={'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
                      with urllib.request.urlopen(req,timeout=18) as response:
                          raw=response.read(20000001);r.update(http_status=response.status,final_url=response.geturl(),content_type=response.headers.get('Content-Type'))
                      if len(raw)>20000000:raise ValueError('OVERSIZE')
                      ext='.pdf' if raw.startswith(b'%PDF') else '.html';fn=str(len(records))+ext;(folder/fn).write_bytes(raw);r.update(path=company+'/'+fn,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
                      if ext=='.html':
                          text=raw.decode('utf-8',errors='replace');parser=Links();parser.feed(text);r['links']=parser.links
                          special=re.findall(r'''[\"']([^\"'<>\s]+\.pdf(?:\?[^\"'<>\s]*)?)[\"']''',text,re.I)
                          candidates=parser.links+[{'href':x,'text':x} for x in special]
                          ranked=[]
                          for link in candidates:
                              dest=urllib.parse.urljoin(r['final_url'],link['href']);h=(urllib.parse.urlparse(dest).hostname or '').lower();label=(link['text']+' '+dest).lower()
                              if not any(h==x or h.endswith('.'+x) for x in ['airoha.com','kinsus.com.tw','accton.com','avc.co','mops.twse.com.tw','doc.twse.com.tw']):continue
                              if '.pdf' in dest.lower():
                                  if re.search(r'2026|115',label):ranked.append((0,dest,depth+1))
                              elif depth<2 and re.search(r'financial|statement|財務|財報|finance|investor|shareholder|annual',label):ranked.append((1,dest,depth+1))
                          for _,dest,d in sorted(ranked,key=lambda x:x[0]):
                              if dest not in seen and dest not in [v[0] for v in queue]:queue.append((dest,d))
                      r['status']='SAVED_UNREVIEWED'
                  except Exception as e:r.update(status='ERROR',error=repr(e))
                  records.append(r)
              return {'company':company,'records':records,'scope':'PUBLIC_IR_ONLY_NO_FINANCIAL_APPROVAL'}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as p:results=list(p.map(run,seeds.items()))
          (root/'manifest.json').write_text(json.dumps({'schema':'PUBLIC_IR_RECOVERY_V1','results':results},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({x['company']:[(r['url'],r['status'],r.get('path')) for r in x['records']] for x in results},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-ir-originals-20260927
          path: ir-originals/
          retention-days: 90
