name: research-documents-recovery-20260927
on:
  push:
    branches: [main]
    paths: [.github/workflows/research_documents_recovery_20260927.yml]
permissions:
  contents: read
jobs:
  public-ir:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve returned PDF URL
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,pathlib,hashlib,datetime
          p=pathlib.Path('accton-pdf');p.mkdir();url='https://doc.twse.com.tw/pdf/202602_2345_AI1_20260927_202420.pdf';r={'url':url,'retrieved_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40) as res:raw=res.read(20000001);r.update(http_status=res.status,final_url=res.geturl(),content_type=res.headers.get('Content-Type'))
              if len(raw)>20000000:raise ValueError('OVERSIZE')
              path='accton_2026Q2.pdf' if raw.startswith(b'%PDF') else 'not_pdf.html';(p/path).write_bytes(raw);r.update(path=path,sha256=hashlib.sha256(raw).hexdigest(),bytes=len(raw),pdf=raw.startswith(b'%PDF'))
          except Exception as e:r['error']=repr(e)
          (p/'manifest.json').write_text(json.dumps(r,ensure_ascii=False,indent=2));print(json.dumps(r))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accton-official-pdf-20260927-2027
          path: accton-pdf/
          retention-days: 90
