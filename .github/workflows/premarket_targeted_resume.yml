name: premarket-targeted-public-resume
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [daily, supplement]
        default: daily
      target_date:
        description: 'auto uses actual clock and official calendar; source snapshot only'
        default: auto
      source_plan:
        description: 'Explicit public source plan for supplement mode'
        default: ''
  push:
    paths: ['.github/workflows/premarket_targeted_resume.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: targeted-public-resume-${{ github.ref }}
  cancel-in-progress: false
jobs:
  daily_source:
    if: github.event_name == 'push' || inputs.operation == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore verified public source cache when retained
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: premarket-targeted-35418262065
          run-id: 35418262065
          github-token: ${{ github.token }}
          path: seed
      - name: Validate cache and fetch only missing or newly dated public inputs
        env:
          TARGET_DATE: ${{ inputs.target_date || 'auto' }}
        run: |
          python -m py_compile scripts/premarket_daily_cached.py
          python scripts/premarket_daily_cached.py --seed seed --out public_daily --symbols-file config/premarket_public_symbols.json --target-date "$TARGET_DATE"
      - name: Preserve exact sources and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public_daily/
            scripts/premarket_daily_cached.py
            scripts/premarket_daily_inputs.py
            config/premarket_public_symbols.json
          retention-days: 30
          if-no-files-found: error
      - name: Scope notice
        if: always()
        run: echo 'Public source snapshot, not a prediction. Next-session dates on holidays do not imply live premarket delivery. Native gaps remain failures.' >> "$GITHUB_STEP_SUMMARY"
  supplement:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'supplement'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch explicit missing sources
        env:
          SOURCE_PLAN: ${{ inputs.source_plan }}
        run: |
          test -n "$SOURCE_PLAN"
          python scripts/premarket_source_supplement.py --plan "$SOURCE_PLAN" --out public_supplement
      - name: Preserve source bytes and limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-supplement-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public_supplement/
            scripts/premarket_source_supplement.py
          retention-days: 30
          if-no-files-found: error
