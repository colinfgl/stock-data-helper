name: premarket-targeted-public-resume
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [resume, supplement]
        default: supplement
      baseline_run_id:
        description: 'Exact existing public acquisition run'
        default: '35414229000'
      target_date:
        description: 'Must match baseline target, not a live-date default'
        default: '2026-09-21'
      symbols:
        description: 'Explicit public tickers only'
        default: ''
      source_plan:
        description: 'Repository path of allowlisted public requests'
        default: 'config/premarket_final_action_sources_20260919.json'
  push:
    paths: ['.github/workflows/premarket_targeted_resume.yml']
permissions: {contents: read, actions: read}
concurrency:
  group: targeted-public-resume-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resume:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'resume'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: premarket-public-input-${{ inputs.baseline_run_id }}
          run-id: ${{ inputs.baseline_run_id }}
          github-token: ${{ github.token }}
          path: baseline
      - name: Resume selected public inputs
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          test -n "$SYMBOLS"
          python scripts/premarket_resume_inputs.py --baseline baseline --out public_resume --target-date "$TARGET_DATE" --symbols "$SYMBOLS"
      - name: Save sources and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-targeted-${{ github.run_id }}
          path: |
            public_resume/
            scripts/premarket_resume_inputs.py
            scripts/premarket_daily_inputs.py
          retention-days: 30
          if-no-files-found: error
  supplement:
    if: github.event_name == 'push' || inputs.operation == 'supplement'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch only the explicit missing primary sources
        env:
          SOURCE_PLAN: ${{ inputs.source_plan || 'config/premarket_final_action_sources_20260919.json' }}
        run: python scripts/premarket_source_supplement.py --plan "$SOURCE_PLAN" --out public_supplement
      - name: Preserve bytes and limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premarket-supplement-${{ github.run_id }}
          path: |
            public_supplement/
            config/premarket_final_action_sources_20260919.json
            scripts/premarket_source_supplement.py
          retention-days: 30
          if-no-files-found: error
      - name: Scope notice
        if: always()
        run: echo 'Public acquisition only. Transport success is not input qualification or forecast success.' >> "$GITHUB_STEP_SUMMARY"
