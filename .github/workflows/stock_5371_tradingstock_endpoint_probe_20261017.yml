name: stock-5371-TPEX-tradingStock-JS-API-exact-probe-20261017
on:
  push:
    branches: [stock-3718-5371-primary-lineage-20261017]
    paths:
      - 'scripts/stock_5371_tpex_tradingstock_probe_20261017.py'
      - '.github/workflows/stock_5371_tradingstock_endpoint_probe_20261017.yml'
permissions:
  contents: read
jobs:
  official-monthly-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax QA
        run: python -m py_compile scripts/stock_5371_tpex_tradingstock_probe_20261017.py
      - name: Probe current original JS API and historic 5371 exact monthly trade rows
        run: python scripts/stock_5371_tpex_tradingstock_probe_20261017.py --out original_tpex_5371_new_api
      - name: Archive exact raw bytes and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TPEx-5371-newAPI-probe-${{ github.run_id }}
          path: original_tpex_5371_new_api/
          if-no-files-found: warn
          retention-days: 30
