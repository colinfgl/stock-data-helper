name: P1B Phase 1 historical as-of data

on:
  push:
    paths:
      - 'scripts/build_p1b_phase1.py'
      - '.github/workflows/p1b_phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Collect P1B phase 1
        shell: bash
        run: |
          set +e
          python scripts/build_p1b_phase1.py
          code=$?
          mkdir -p output_p1b_phase1
          echo "$code" > output_p1b_phase1/exit_code.txt
          exit 0
      - name: Upload P1B phase 1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1b-phase1-20260828
          path: output_p1b_phase1/
          if-no-files-found: error
      - name: Enforce collection gate
        shell: bash
        run: |
          code=$(cat output_p1b_phase1/exit_code.txt)
          test "$code" = "0"
