name: B1 exact missing-source repair
'on':
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        description: 'Existing 2026-09-21 commissioning snapshot only; not a live prediction'
        options: [remaining_scope, native_retry]
        default: remaining_scope
  push:
    paths:
      - '.github/workflows/b1_exact_source_repair.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: b1-exact-source-repair
  cancel-in-progress: false
jobs:
  repair-only-missing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record bootstrap before external artifact access
        run: |
          mkdir -p b1_output
          python -c 'import json,datetime;json.dump({"stage":"BOOTSTRAP","run_id":"${{ github.run_id }}","started_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"formal_input_qualified":False},open("b1_output/bootstrap.json","w"))'
      - name: Restore exact retained public evidence without refetching successful market data
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '35414229000'
          artifact-ids: '10577563243'
          merge-multiple: true
          path: b1_restored
      - name: Prepare unchanged original validator and targeted tools
        run: |
          mkdir -p b1_output/runtime
          cp scripts/premarket_retry_chart.py scripts/premarket_b1_missing_scope.py b1_output/runtime/
          cp b1_restored/scripts/premarket_daily_inputs.py b1_output/runtime/
          python -c 'import hashlib,pathlib;assert hashlib.sha256(pathlib.Path("b1_output/runtime/premarket_daily_inputs.py").read_bytes()).hexdigest()=="7673ce89cefae65ac1beaf8f7f5404c40192f22bbf6667e5ab1b0f9166893fb5"'
      - name: Check previously unverified public universe and missing action families only
        if: ${{ inputs.phase != 'native_retry' }}
        run: python b1_output/runtime/premarket_b1_missing_scope.py
      - name: Explicit native-only retry, never invoked by remaining-scope phase
        if: ${{ inputs.phase == 'native_retry' }}
        run: |
          python b1_output/runtime/premarket_retry_chart.py --baseline b1_restored/official_daily_inputs --receipt-sha256 218b7c4c91b6d4dd6444dec895ae817577d49fc722727009e43e5dabf13bf8c0 --target-date 2026-09-21 --symbols 0050.TW --execute --out b1_output/native_retry
      - name: Preserve exact new raw evidence even when source qualification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-exact-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            b1_output/
            b1_scope_output/
          if-no-files-found: error
          retention-days: 30
