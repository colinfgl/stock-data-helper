name: B1 exact missing-source repair
'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/b1_exact_source_repair.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: b1-exact-source-repair
  cancel-in-progress: false
jobs:
  repair-only-missing:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture remaining OTC action sources using official menu and page declarations
        run: |
          mkdir -p b1_otc_actions
          cat > b1_otc_actions/collect.py <<'PY'
          import datetime as dt,hashlib,json,pathlib,re,urllib.request,urllib.parse
          out=pathlib.Path('b1_otc_actions');sources=[]
          def stamp():return dt.datetime.now(dt.timezone.utc).isoformat()
          def get(key,url):
              r={'key':key,'url':url,'retrieved_at':stamp(),'qualified':False};sources.append(r)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/html'})
                  with urllib.request.urlopen(req,timeout=20) as f:b=f.read();r.update(http_status=f.status,content_type=f.headers.get('Content-Type'),final_url=f.url)
                  (out/(key+'.raw')).write_bytes(b);r.update(status='FETCHED',path=key+'.raw',sha256=hashlib.sha256(b).hexdigest(),bytes=len(b))
                  return b.decode('utf8')
              except Exception as e:r.update(status='FETCH_FAILED',error=str(e));return None
          result={'started_at':stamp(),'sources':sources,'scope_from':'2026-09-17','scope_through':'2026-09-21','price_requests':0,'model_runs':0,'formal_input_qualified':False}
          menu=get('menu','https://www.tpex.org.tw/data/menu/zh-tw/menu.json')
          get('reduction_notice','https://www.tpex.org.tw/www/zh-tw/bulletin/decap?startDate=2026%2F09%2F17&endDate=2026%2F09%2F21&response=json')
          targets=[]
          def walk(x):
              if isinstance(x,list):
                  for v in x:walk(v)
              elif isinstance(x,dict):
                  title=str(x.get('title',''));link=str(x.get('link',''))
                  if ('面額' in title or '分割' in title) and link.startswith('/zh-tw/'):
                      targets.append((title,'https://www.tpex.org.tw'+link))
                  for k,v in x.items():
                      if isinstance(v,(dict,list)):walk(v)
          if menu:
              try:walk(json.loads(menu))
              except ValueError:pass
          result['menu_matches']=targets
          seen=set()
          for i,(title,url) in enumerate(targets[:8]):
              if url in seen:continue
              seen.add(url);text=get('page_'+str(i),url)
              if not text:continue
              actions=re.findall(r'action:"([A-Za-z0-9_/-]+)"',text)
              for j,a in enumerate(actions[:2]):
                  if not a.startswith(('bulletin/','stock/','etf/','announce/')):continue
                  get('data_'+str(i)+'_'+str(j),'https://www.tpex.org.tw/www/zh-tw/'+a+'?startDate=2026%2F09%2F17&endDate=2026%2F09%2F21&response=json')
          result['completed_at']=stamp();(out/'receipt.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf8')
          print(json.dumps({'sources':len(sources),'menu_targets':len(targets),'formal_input_qualified':False}))
          PY
          python b1_otc_actions/collect.py
      - name: Preserve remaining evidence and exact source code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-otc-actions-${{ github.run_id }}-${{ github.run_attempt }}
          path: b1_otc_actions/
          if-no-files-found: error
          retention-days: 30
