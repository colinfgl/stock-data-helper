name: Build all20 adjusted through 2026-09-08

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_all20_adjusted_20260908.py'
      - '.github/workflows/build_all20_adjusted_20260908.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Restore exact R110 canonical artifact through 2026-09-07
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34181678827 -n all20-adjusted-through-20260907 -D scripts/r110_base
      - name: Restore exact TWSE 2026-09-08 snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34199098393 -n twse-close-20260908 -D scripts/twse_0908
      - name: Extend exact R110 canonical by one trading day
        working-directory: scripts
        env:
          R45_GITHUB_TOKEN: ${{ github.token }}
        run: python build_all20_adjusted_20260908.py
      - name: Upload extension artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all20-adjusted-through-20260908
          path: scripts/output_all20_20260908/
          if-no-files-found: error
          retention-days: 90
