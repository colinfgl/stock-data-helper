name: shadow-explainability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/explain_shadow_nn.py'
      - '.github/workflows/shadow-explainability.yml'

permissions:
  contents: write

concurrency:
  group: shadow-explainability
  cancel-in-progress: true

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas torch
      - name: Generate Integrated Gradients receipts
        run: python scripts/explain_shadow_nn.py
      - name: Commit explanation artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/shadow_explain/
          if git diff --cached --quiet; then
            echo "No explainability output changes"
          else
            git commit -m "Update neural shadow Integrated Gradients receipts"
            git pull --rebase origin main
            git push
          fi
